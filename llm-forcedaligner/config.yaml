trainer:
  max_epochs: 10
  log_every_n_steps: 10
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8
  callbacks:
    - class_path: LearningRateMonitor
    - class_path: EarlyStopping
      init_args:
        monitor: val_aas_ms
        mode: min
  logger:
    - class_path: TensorBoardLogger
      init_args:
        save_dir: .
    - class_path: llm_forcedaligner.logger.TrackioLogger
      init_args:
        project: llm-forcedaligner

model:
  # attn_implementation: kernels-community/flash-attn3
  lr: 1e-4
  weight_decay: 1e-2
  warmup_steps: 100

data:
  dataset_path: NextFire/karaoke-alignments
  dataset_split: train
  batch_size: 1
